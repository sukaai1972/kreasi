<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SDP</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

#arena {
    position: relative;

    /* Menyesuaikan layar HP, rasio 9:16 */
    width: min(100vw - 20px, 600px);
    height: min(100vh - 20px, 1066px);

    aspect-ratio: 9 / 16;

    background: #000;
    border: 4px solid red;
    overflow: hidden;
}

.sdp {
    position: absolute;
    left: 0;
    top: 0;

    font-size: clamp(20px, 6vw, 34px);
    font-weight: bold;

    white-space: nowrap;
    user-select: none;
    pointer-events: none;

    will-change: transform;
}
</style>
</head>

<body>

<div id="arena"></div>

<script>

const arena = document.getElementById("arena");

const JUMLAH = 10;


/* =====================================
   20 WARNA
===================================== */

const warna = [
    "#FFFF00",
    "#00FF00",
    "#00FFFF",
    "#FF00FF",
    "#FF6600",
    "#FFFFFF",
    "#0088FF",
    "#FF1493",
    "#AAFF00",
    "#AA66FF",
    "#FF3333",
    "#33FF99",
    "#3399FF",
    "#FF9933",
    "#FF66CC",
    "#66FFFF",
    "#CCFF33",
    "#CC66FF",
    "#FFD700",
    "#00FF88"
];


const objek = [];


/* =====================================
   BUAT 10 SDP
===================================== */

for (let i = 0; i < JUMLAH; i++) {

    const el = document.createElement("div");

    el.className = "sdp";
    el.textContent = "SDP";

    el.style.color =
        warna[Math.floor(Math.random() * warna.length)];

    arena.appendChild(el);

    objek.push({
        el: el,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        w: 0,
        h: 0,
        lastCollision: -1
    });
}


/* =====================================
   UKURAN OBJEK
===================================== */

function ukur() {

    objek.forEach(o => {

        o.w = o.el.offsetWidth;
        o.h = o.el.offsetHeight;

    });
}


/* =====================================
   CEK TABRAKAN
===================================== */

function bertabrakan(a, b) {

    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}


/* =====================================
   WARNA RANDOM
===================================== */

function warnaRandom() {

    return warna[
        Math.floor(Math.random() * warna.length)
    ];
}


/* =====================================
   POSISI AWAL
===================================== */

function posisiAwal() {

    objek.forEach((o, index) => {

        const maxX =
            arena.clientWidth - o.w;

        const maxY =
            arena.clientHeight - o.h;

        let berhasil = false;

        for (let percobaan = 0; percobaan < 500; percobaan++) {

            o.x = Math.random() * maxX;
            o.y = Math.random() * maxY;

            berhasil = true;

            for (let j = 0; j < index; j++) {

                if (bertabrakan(o, objek[j])) {

                    berhasil = false;
                    break;
                }
            }

            if (berhasil) break;
        }

        /* Arah random */

        const sudut =
            Math.random() * Math.PI * 2;

        /* Pelan */

        const kecepatan =
            25 + Math.random() * 20;

        o.vx =
            Math.cos(sudut) * kecepatan;

        o.vy =
            Math.sin(sudut) * kecepatan;
    });
}


/* =====================================
   PANTULAN ANTAR SDP
===================================== */

function pantulan(a, b) {

    const ax = a.x + a.w / 2;
    const ay = a.y + a.h / 2;

    const bx = b.x + b.w / 2;
    const by = b.y + b.h / 2;

    const dx = bx - ax;
    const dy = by - ay;


    /* Tentukan sisi yang bertabrakan */

    const overlapX =
        (a.w + b.w) / 2 -
        Math.abs(dx);

    const overlapY =
        (a.h + b.h) / 2 -
        Math.abs(dy);


    if (overlapX < overlapY) {

        /* Tabrakan kiri-kanan */

        const dorong =
            overlapX / 2;

        if (dx > 0) {

            a.x -= dorong;
            b.x += dorong;

        } else {

            a.x += dorong;
            b.x -= dorong;
        }


        /* Tukar kecepatan */

        const temp = a.vx;

        a.vx = b.vx;
        b.vx = temp;

    } else {

        /* Tabrakan atas-bawah */

        const dorong =
            overlapY / 2;

        if (dy > 0) {

            a.y -= dorong;
            b.y += dorong;

        } else {

            a.y += dorong;
            b.y -= dorong;
        }


        const temp = a.vy;

        a.vy = b.vy;
        b.vy = temp;
    }


    /* =================================
       GANTI WARNA KEDUANYA
    ================================= */

    a.el.style.color = warnaRandom();
    b.el.style.color = warnaRandom();
}


/* =====================================
   INISIALISASI
===================================== */

ukur();
posisiAwal();


/* =====================================
   ANIMASI
===================================== */

let waktuSebelumnya =
    performance.now();


function animasi(waktuSekarang) {

    const dt =
        Math.min(
            (waktuSekarang - waktuSebelumnya) / 1000,
            0.03
        );

    waktuSebelumnya =
        waktuSekarang;


    /* ================================
       GERAKKAN SEMUA
    ================================= */

    objek.forEach(o => {

        o.x += o.vx * dt;
        o.y += o.vy * dt;


        const maxX =
            arena.clientWidth - o.w;

        const maxY =
            arena.clientHeight - o.h;


        /* KIRI */

        if (o.x <= 0) {

            o.x = 0;
            o.vx = Math.abs(o.vx);
        }


        /* KANAN */

        if (o.x >= maxX) {

            o.x = maxX;
            o.vx = -Math.abs(o.vx);
        }


        /* ATAS */

        if (o.y <= 0) {

            o.y = 0;
            o.vy = Math.abs(o.vy);
        }


        /* BAWAH */

        if (o.y >= maxY) {

            o.y = maxY;
            o.vy = -Math.abs(o.vy);
        }

    });


    /* ================================
       CEK TABRAKAN
    ================================= */

    for (let i = 0; i < objek.length; i++) {

        for (let j = i + 1; j < objek.length; j++) {

            const a = objek[i];
            const b = objek[j];

            if (bertabrakan(a, b)) {

                pantulan(a, b);
            }
        }
    }


    /* ================================
       TAMPILKAN
    ================================= */

    objek.forEach(o => {

        o.el.style.transform =
            `translate3d(${o.x}px, ${o.y}px, 0)`;

    });


    requestAnimationFrame(animasi);
}


requestAnimationFrame(animasi);


/* =====================================
   JIKA LAYAR BERUBAH
===================================== */

window.addEventListener("resize", () => {

    ukur();

    objek.forEach(o => {

        const maxX =
            arena.clientWidth - o.w;

        const maxY =
            arena.clientHeight - o.h;

        o.x =
            Math.max(0, Math.min(o.x, maxX));

        o.y =
            Math.max(0, Math.min(o.y, maxY));
    });

});

</script>

</body>
</html>
