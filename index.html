<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Utama</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background: #000;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        padding: 25px;
    }

    .container {
        width: 100%;
        max-width: 600px;
        text-align: center;
    }

    /* Judul */

    h1 {
        margin: 0 0 10px 0;
        font-size: 38px;
        color: white;
    }

    .subtitle {
        color: #aaa;
        margin-bottom: 35px;
        font-size: 16px;
    }


    /* =================================
       MENU
    ================================= */

    .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }


    .menu a {
        text-decoration: none;
        color: white;

        padding: 25px 15px;

        background: #111;

        border: 2px solid #333;
        border-radius: 15px;

        font-size: 20px;
        font-weight: bold;

        transition: 0.25s;
    }


    .menu a:hover {
        transform: scale(1.04);
        background: #1b1b1b;
        border-color: white;
    }


    /* Warna masing-masing menu */

    .menu1 {
        border-color: #ffff00 !important;
        color: #ffff00 !important;
    }

    .menu2 {
        border-color: #00ff00 !important;
        color: #00ff00 !important;
    }

    .menu3 {
        border-color: #00ffff !important;
        color: #00ffff !important;
    }

    .menu4 {
        border-color: #ff00ff !important;
        color: #ff00ff !important;
    }

    .menu5 {
        border-color: #ff6600 !important;
        color: #ff6600 !important;
    }

    .menu6 {
        border-color: #ff3333 !important;
        color: #ff3333 !important;
    }


    /* =================================
       HP
    ================================= */

    @media (max-width: 500px) {

        body {
            padding: 15px;
        }

        h1 {
            font-size: 30px;
        }

        .menu {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .menu a {
            padding: 20px;
        }
    }

</style>
</head>


<body>

<div class="container">

    <h1>MENU UTAMA</h1>

    <div class="subtitle">
        Pilih halaman yang ingin dibuka
    </div>


    <div class="menu">
