<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDP - 20 Warna</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

#arena {
    position: relative;
    width: 600px;
    height: 600px;
    background: #000;
    border: 4px solid red;
    overflow: hidden;
}

.text {
    position: absolute;
    font-size: 32px;
    font-weight: bold;
    white-space: nowrap;
    user-select: none;
    will-change: transform;
}
</style>
</head>

<body>

<div id="arena"></div>

<script>

const arena = document.getElementById("arena");

const jumlah = 10;


// ========================================
// 20 WARNA
// ========================================

const warna = [
    "#FFFF00", // kuning
    "#00FF00", // hijau
    "#00FFFF", // cyan
    "#FF00FF", // magenta
    "#FF6600", // orange
    "#FFFFFF", // putih
    "#0088FF", // biru
    "#FF1493", // pink
    "#AAFF00", // lime
    "#AA66FF", // ungu
    "#FF3333", // merah
    "#33FF99", // hijau mint
    "#3399FF", // biru muda
    "#FF9933", // jingga
    "#FF66CC", // pink muda
    "#66FFFF", // aqua
    "#CCFF33", // hijau terang
    "#CC66FF", // ungu muda
    "#FFD700", // gold
    "#00FF88"  // emerald
];


// ========================================
// ARRAY OBJEK
// ========================================

const objects = [];


// ========================================
// MEMBUAT 10 SDP
// ========================================

for (let i = 0; i < jumlah; i++) {

    const element = document.createElement("div");

    element.className = "text";
    element.textContent = "SDP";

    element.style.color =
        warna[Math.floor(Math.random() * warna.length)];

    arena.appendChild(element);

    objects.push({
        element: element,

        x: 0,
        y: 0,

        vx: 0,
        vy: 0,

        width: 0,
        height: 0,

        // Mencegah perubahan warna
        // berkali-kali selama satu tabrakan
        cooldown: 0
    });
}


// ========================================
// UKURAN
// ========================================

objects.forEach(obj => {

    obj.width = obj.element.offsetWidth;
    obj.height = obj.element.offsetHeight;

});


// ========================================
// CEK TABRAKAN
// ========================================

function tabrakan(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


// ========================================
// POSISI AWAL
// ========================================

objects.forEach((obj, index) => {

    const maxX =
        arena.clientWidth - obj.width;

    const maxY =
        arena.clientHeight - obj.height;

    let aman = false;

    while (!aman) {

        obj.x = Math.random() * maxX;
        obj.y = Math.random() * maxY;

        aman = true;

        for (let i = 0; i < index; i++) {

            if (tabrakan(obj, objects[i])) {

                aman = false;
                break;
            }
        }
    }


    // Arah random
    const angle =
        Math.random() * Math.PI * 2;


    // Kecepatan pelan
    const speed =
        25 + Math.random() * 20;


    obj.vx =
        Math.cos(angle) * speed;

    obj.vy =
        Math.sin(angle) * speed;

});


// ========================================
// WARNA RANDOM
// ========================================

function warnaRandom() {

    return warna[
        Math.floor(
            Math.random() * warna.length
        )
    ];
}


// ========================================
// TABRAKAN
// ========================================

function pantulkan(a, b) {

    const ax =
        a.x + a.width / 2;

    const ay =
        a.y + a.height / 2;

    const bx =
        b.x + b.width / 2;

    const by =
        b.y + b.height / 2;


    const dx = bx - ax;
    const dy = by - ay;


    const overlapX =
        (a.width + b.width) / 2 -
        Math.abs(dx);

    const overlapY =
        (a.height + b.height) / 2 -
        Math.abs(dy);


    // ====================================
    // TENTUKAN ARAH PANTULAN
    // ====================================

    if (overlapX < overlapY) {

        const push =
            overlapX / 2;


        if (dx > 0) {

            a.x -= push;
            b.x += push;

        } else {

            a.x += push;
            b.x -= push;

        }


        // Tukar kecepatan horizontal
        const temp = a.vx;

        a.vx = b.vx;
        b.vx = temp;

    }

    else {

        const push =
            overlapY / 2;


        if (dy > 0) {

            a.y -= push;
            b.y += push;

        } else {

            a.y += push;
            b.y -= push;

        }


        // Tukar kecepatan vertikal
        const temp = a.vy;

        a.vy = b.vy;
        b.vy = temp;

    }


    // ====================================
    // GANTI WARNA KEDUANYA
    // ====================================

    a.element.style.color =
        warnaRandom();

    b.element.style.color =
        warnaRandom();

}


// ========================================
// ANIMASI
// ========================================

let lastTime =
    performance.now();


function animate(now) {

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            0.03
        );

    lastTime = now;


    // ====================================
    // GERAK
    // ====================================

    objects.forEach(obj => {

        obj.x += obj.vx * dt;
        obj.y += obj.vy * dt;


        const maxX =
            arena.clientWidth -
            obj.width;

        const maxY =
            arena.clientHeight -
            obj.height;


        // -------------------------------
        // KIRI
        // -------------------------------

        if (obj.x <= 0) {

            obj.x = 0;

            obj.vx =
                Math.abs(obj.vx);
        }


        // -------------------------------
        // KANAN
        // -------------------------------

        if (obj.x >= maxX) {

            obj.x = maxX;

            obj.vx =
                -Math.abs(obj.vx);
        }


        // -------------------------------
        // ATAS
        // -------------------------------

        if (obj.y <= 0) {

            obj.y = 0;

            obj.vy =
                Math.abs(obj.vy);
        }


        // -------------------------------
        // BAWAH
        // -------------------------------

        if (obj.y >= maxY) {

            obj.y = maxY;

            obj.vy =
                -Math.abs(obj.vy);
        }

    });


    // ====================================
    // TABRAKAN ANTAR SDP
    // ====================================

    for (
        let i = 0;
        i < objects.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < objects.length;
            j++
        ) {

            const a = objects[i];
            const b = objects[j];


            if (tabrakan(a, b)) {

                /*
                 * Jangan hanya memantul,
                 * tetapi sekaligus mengganti
                 * warna kedua tulisan.
                 */

                pantulkan(a, b);
            }
        }
    }


    // ====================================
    // TAMPILKAN
    // ====================================

    objects.forEach(obj => {

        obj.element.style.transform =
            `translate3d(
                ${obj.x}px,
                ${obj.y}px,
                0
            )`;

    });


    requestAnimationFrame(animate);
}


requestAnimationFrame(animate);

</script>

</body>
</html>
